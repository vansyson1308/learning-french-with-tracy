# Phase 0 CI: install → typecheck → tests (across timezones) → lint → export size.
#
# Test runner decision (Phase 0 spike): `bun test`.
# - Bun is already the package manager; the runner needs zero new config.
# - Every unit under test is a pure TS module (grading, dates, migrations,
#   backup-core, review-builder) or runs against the AsyncStorage/expo-module
#   mocks preloaded via bunfig.toml — no React Native runtime is ever loaded,
#   so no babel/jest-expo transform chain is needed.
# - `jest-expo` remains the documented option if component tests are wanted
#   later; it was not adopted now because it adds a large dependency and
#   transform surface for zero additional coverage at this phase.
#
# The test job runs under several timezones on purpose: streak/day logic is
# local-time-based and the v0→v1 migration grandfathers UTC-written day keys,
# so both offset signs (and UTC itself) must stay green. Phase 10 adds the
# two extreme offsets (UTC+14 and UTC−11) so a day boundary can never hide
# behind a moderate zone.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: ["UTC", "America/Los_Angeles", "Asia/Tokyo", "Pacific/Kiritimati", "Pacific/Pago_Pago"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11 # pinned to the locally verified Phase-0/1 toolchain
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        # `bun run test` uses the scoped script (src + scripts): raw
        # `bun test` would also sweep up the jest-only integration suite.
        run: bun run test
      - name: Lint
        if: matrix.tz == 'UTC'
        run: bun run lint
      # Phase 3: jest-expo + RNTL integration suite (real Expo Router tree).
      # Timezone-independent, so the UTC leg carries it.
      - name: Integration tests (jest-expo)
        if: matrix.tz == 'UTC'
        run: bun run test:integration
      # Phase 2 content pipeline: sources validate, generated artifacts are
      # not stale, and the immutable legacy audio baseline is untouched.
      # These make zero network (and zero paid-API) calls by construction.
      - name: Content pipeline check
        if: matrix.tz == 'UTC'
        run: bun run content:check
      - name: Audio baseline check
        if: matrix.tz == 'UTC'
        run: bun run audio:check
      # Phase 10 Gate 1: the distribution identity must match the committed
      # record exactly, and an unconfirmed (inherited) identity keeps store
      # distribution BLOCKED. Pure config check — no network.
      - name: Release identity gate
        if: matrix.tz == 'UTC'
        run: bun run release:identity

  export-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11 # pinned to the locally verified Phase-0/1 toolchain
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Export web bundle
        run: bunx expo export --platform web --output-dir dist
      - name: Report export size
        run: |
          echo "## Web export size" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh dist/_expo/static/js/web/*.js | sort -rh | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
