# Phase 0 CI: install → typecheck → tests (across timezones) → lint → export size.
#
# Test runner decision (Phase 0 spike): `bun test`.
# - Bun is already the package manager; the runner needs zero new config.
# - Every unit under test is a pure TS module (grading, dates, migrations,
#   backup-core, review-builder) or runs against the AsyncStorage/expo-module
#   mocks preloaded via bunfig.toml — no React Native runtime is ever loaded,
#   so no babel/jest-expo transform chain is needed.
# - `jest-expo` remains the documented option if component tests are wanted
#   later; it was not adopted now because it adds a large dependency and
#   transform surface for zero additional coverage at this phase.
#
# The test job runs under several timezones on purpose: streak/day logic is
# local-time-based and the v0→v1 migration grandfathers UTC-written day keys,
# so both offset signs (and UTC itself) must stay green. Phase 10 adds the
# two extreme offsets (UTC+14 and UTC−11) so a day boundary can never hide
# behind a moderate zone.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Commits pushed by a workflow token never trigger `push`: re-run CI on the
  # branch a data workflow committed to as soon as it finishes, and once a day
  # on the default branch, so a bot commit can never leave `main` red silently.
  # P3f: only for data commits on `main` — a feature branch gets CI from its own
  # push / pull_request events (a workflow_run run is reported against the
  # default branch, so a feature-branch run there showed `main` red).
  workflow_run:
    workflows: ["Audio pipeline (v2)", "Lexicon source (ETL v2)", "Lexique 4 source", "EAS build (Android RC)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  # scripts/ci/bot-commit.sh dispatches CI on the branch it pushed to: the
  # pull_request run of a bot-authored head waits for a human approval
  # (action_required), and workflow_dispatch is the one event the workflow
  # token may start.
  workflow_dispatch:

# Read-only token: nothing in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  checks:
    # After a data workflow: only when it succeeded (a failed run committed nothing).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15 # normal ≈ 3 min
    strategy:
      matrix:
        tz: ["UTC", "America/Los_Angeles", "Asia/Tokyo", "Pacific/Kiritimati", "Pacific/Pago_Pago"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run: the tip of the branch the data workflow committed to.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11 # pinned to the locally verified Phase-0/1 toolchain
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        # `bun run test` uses the scoped script (src + scripts): raw
        # `bun test` would also sweep up the jest-only integration suite.
        run: bun run test
      # P1a: the golden gate as its own named step (the suites also run
      # inside `bun run test`): compile manifest vs committed artifacts and a
      # fresh in-memory recompile, then the runtime snapshot suites. Runs in
      # every timezone lane on purpose — a snapshot that drifts with the
      # local day is a golden bug.
      - name: Golden tests (French behaviour pinned)
        run: bun scripts/golden.ts --check
      - name: Lint
        if: matrix.tz == 'UTC'
        run: bun run lint
      # P2a: the generated MessageKey union and the sorted catalogues must be committed.
      - name: i18n catalogue check
        if: matrix.tz == 'UTC'
        run: bun scripts/i18n-keys.ts --check
      # Phase 3: jest-expo + RNTL integration suite (real Expo Router tree).
      # Timezone-independent, so the UTC leg carries it.
      - name: Integration tests (jest-expo)
        if: matrix.tz == 'UTC'
        run: bun run test:integration
      # Phase 2 content pipeline: sources validate, generated artifacts are
      # not stale, and the immutable legacy audio baseline is untouched.
      # These make zero network (and zero paid-API) calls by construction.
      - name: Content pipeline check
        if: matrix.tz == 'UTC'
        run: bun run content:check
      - name: Audio baseline check
        if: matrix.tz == 'UTC'
        run: bun run audio:check
      # Phase 10 Gate 1: the distribution identity must match the committed
      # record exactly, and an unconfirmed (inherited) identity keeps store
      # distribution BLOCKED. Pure config check — no network.
      - name: Release identity gate
        if: matrix.tz == 'UTC'
        run: bun run release:identity

  # P3e §8: LanguageTool (LGPL-2.1) checks every Spanish target string of
  # es-vi. A CI/dev tool only — downloaded on the runner (pinned + hashed),
  # never shipped, so it is not in the shipped-provenance registry. A match
  # fails unless content/es/languagetool-allow.json allows it with a reason.
  languagetool:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LT_VERSION: "6.6"
      LT_SHA256: 53600506b399bb5ffe1e4c8dec794fd378212f14aaf38ccef9b6f89314d11631
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11 # pinned to the locally verified Phase-0/1 toolchain
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Download LanguageTool (pinned, hash-checked)
        timeout-minutes: 10
        run: |
          bash scripts/ci/fetch.sh "https://languagetool.org/download/LanguageTool-${LT_VERSION}.zip" "$RUNNER_TEMP/lt.zip"
          echo "${LT_SHA256}  $RUNNER_TEMP/lt.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/lt.zip" -d "$RUNNER_TEMP"
      - name: Start LanguageTool server
        run: |
          # Each check is capped server-side; the client times out a request too (scripts/languagetool.ts).
          printf 'maxCheckTimeMillis=30000\nmaxCheckThreads=4\n' > "$RUNNER_TEMP/lt-server.properties"
          (cd "$RUNNER_TEMP/LanguageTool-${LT_VERSION}" && nohup java -Xmx2g -cp languagetool-server.jar org.languagetool.server.HTTPServer --port 8081 --config "$RUNNER_TEMP/lt-server.properties" > "$RUNNER_TEMP/lt.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:8081/v2/languages > /dev/null && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/lt.log"; exit 1
      - name: LanguageTool gate (es-vi)
        run: bun scripts/languagetool.ts --course es-vi --server http://localhost:8081
      - name: LanguageTool gate (de-vi)
        run: bun scripts/languagetool.ts --course de-vi --server http://localhost:8081 --json "$RUNNER_TEMP/lt-de-vi.json"
      - name: LanguageTool gate (it-vi)
        run: bun scripts/languagetool.ts --course it-vi --server http://localhost:8081 --json "$RUNNER_TEMP/lt-it-vi.json"
      # French: the graded stories only (content/fr/stories/stories.json, shared by fr-en and
      # fr-vi). The rest of the French course is frozen byte-identical (CLAUDE.md §4), so
      # its findings could only be allowed, never fixed; the stories are the French text
      # that still grows.
      - name: LanguageTool gate (fr stories)
        run: bun scripts/languagetool.ts --course fr-vi --scope stories --server http://localhost:8081
      - name: LanguageTool server log (on failure)
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/lt.log" || true
      - name: Upload the LanguageTool findings (de-vi)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: languagetool-de-vi
          path: ${{ runner.temp }}/lt-de-vi.json
          if-no-files-found: ignore
      - name: Upload the LanguageTool findings (it-vi)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: languagetool-it-vi
          path: ${{ runner.temp }}/lt-it-vi.json
          if-no-files-found: ignore

  export-size:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11 # pinned to the locally verified Phase-0/1 toolchain
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Export web bundle
        run: bunx expo export --platform web --output-dir dist
      # The acceptance-only Opus check (route + fixture) is never in a release
      # export: LFT_ACCEPTANCE_DIAGNOSTICS is unset here (metro.config.js).
      - name: The release export holds no diagnostics
        run: bun scripts/check-diagnostics-export.ts dist --absent
      - name: Report export size
        run: |
          echo "## Web export size" >> "$GITHUB_STEP_SUMMARY"
          du -sh dist | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh dist/_expo/static/js/web/*.js | sort -rh | head -5 | tee -a "$GITHUB_STEP_SUMMARY"
      # P3g B2: course content loads on demand; the entry chunk stays ≤ 4.5 MB.
      - name: Web entry bundle budget
        run: bun scripts/check-web-entry.ts dist | tee -a "$GITHUB_STEP_SUMMARY"
      # Phase 10: browser E2E over the export (the runner's Chrome; the
      # web tier is honestly labelled — speech surfaces show their skip
      # affordances). No network beyond localhost.
      - name: Documentation site builds from repository sources
        run: bun scripts/build-site.ts
      - name: Browser E2E (web tier)
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome
        run: bun run e2e:web dist
      # V1 publication §16: every section of the user guide is walked against
      # the export; a guide claim the app does not honour fails the build.
      - name: User-guide walk (web tier)
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome
        run: bun run e2e:guide dist
      # P2a: the same smoke and guide walk with the UI pinned to Vietnamese
      # (EXPO_PUBLIC_UI_LANG is inlined into the export); selectors are
      # testIDs and the expected labels come from the Vietnamese catalogue.
      - name: Export web bundle (Vietnamese UI)
        env:
          EXPO_PUBLIC_UI_LANG: vi
        # --clear: the transform cache of the English export would otherwise keep the inlined env.
        run: bunx expo export --platform web --output-dir dist-vi --clear
      # P2b: the Vietnamese lane walks the Vietnamese-native French course.
      - name: Browser E2E (web tier, Vietnamese UI, fr-vi)
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome
          UI_LANG: vi
          E2E_COURSE: fr-vi
        run: bun run e2e:web dist-vi
      - name: User-guide walk (web tier, Vietnamese UI, fr-vi)
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome
          UI_LANG: vi
          E2E_COURSE: fr-vi
        run: bun run e2e:guide dist-vi
      # P3d: the Vietnamese-first Spanish course and its DELE A1 exam track.
      - name: Exam-track E2E (web tier, Vietnamese UI, es-vi)
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome
          UI_LANG: vi
        run: bun run e2e:exam dist-vi
      # Opus playback on the web tier (release/ASSET_DELIVERY.md): a separate
      # export built with LFT_ACCEPTANCE_DIAGNOSTICS=1 carries the acceptance-only
      # route; the browser plays the Opus story sentence at rate 1 and in slow mode.
      - name: Export web bundle (acceptance diagnostics)
        env:
          LFT_ACCEPTANCE_DIAGNOSTICS: "1"
        run: |
          bunx expo export --platform web --output-dir dist-diag --clear
          bun scripts/check-diagnostics-export.ts dist-diag --present
      - name: Opus playback E2E (web tier)
        env:
          E2E_BROWSER_PATH: /usr/bin/google-chrome
        run: bun run e2e:opus dist-diag
