# Developer-dispatched lexicon source acquisition (P3a, lexicon ETL v2).
#
# This is NOT part of the CI gate and can never run automatically: it has
# exactly one trigger, workflow_dispatch. CI (ci.yml) stays fully offline on
# the committed derived data. GitHub-hosted runners download the open
# sources from their OFFICIAL locations (kaikki.org, raw.githubusercontent.com,
# downloads.tatoeba.org, edrdg.org, mdbg.net, pypi.org, newgeneralservicelist.com),
# hash them, and commit only the derived evidence — the multi-GB kaikki dumps
# are streamed and discarded (the small artifacts are kept as run artifacts
# for audit).
#
# Modes (scripts/lexicon-etl.ts):
#   recon    fetch every catalogued source TWICE (the two retrievals must
#            hash identically), pin sha256/bytes/date into
#            content/<lang>/lexicon/source-manifest.json, capture the
#            licence notes under content/<lang>/lexicon/sources/, write
#            derived/recon.json. No learner-facing derivation.
#   extract  fetch, verify every artifact against the pinned sha256
#            (a mismatch is source-version drift — the run fails), derive
#            content/<lang>/lexicon/derived/*.json and, for --author-size > 0,
#            author the lexicon (scripts/lexicon-author.ts).
#   both     recon then extract in one run (first contact with a language).
name: Lexicon source (ETL v2)

on:
  workflow_dispatch:
    inputs:
      lang:
        description: "target language code (es, de, it, pt, ja, ko, zh, en)"
        required: true
        type: choice
        options: [es, de, it, pt, ja, ko, zh, en]
      mode:
        description: "recon (pin), extract (requires pins) or both"
        required: true
        type: choice
        options: [recon, extract, both]
      author_size:
        description: "lexemes to author after extract (0 = pool only)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

concurrency:
  group: lexicon-source-${{ inputs.lang }}
  cancel-in-progress: false

jobs:
  acquire:
    # Defense in depth: refuse anything but a manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCRATCH: /tmp/lexicon-src
      # Inputs reach the shell only through the environment (never expanded into the script text).
      LANG_INPUT: ${{ inputs.lang }}
      MODE_INPUT: ${{ inputs.mode }}
      AUTHOR_SIZE: ${{ inputs.author_size }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11 # same pin as ci.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Fetch official sources (twice; identical hashes required)
        run: |
          set -euo pipefail
          mkdir -p "$SCRATCH/$LANG_INPUT"
          bun scripts/lexicon-etl.ts fetch --lang "$LANG_INPUT" --dir "$SCRATCH" --twice

      - name: Export wordfreq (pinned 3.1.1)
        run: |
          set -euo pipefail
          python -m pip install --quiet "wordfreq[cjk]==3.1.1"
          python scripts/lib/lexicon-etl/export-wordfreq.py "$LANG_INPUT" "$SCRATCH/$LANG_INPUT/wordfreq-$LANG_INPUT.csv"

      - name: Recon (pin sha256/bytes/date, licence notes, samples)
        if: inputs.mode == 'recon' || inputs.mode == 'both'
        run: |
          set -euo pipefail
          bun scripts/lexicon-etl.ts recon --lang "$LANG_INPUT" --dir "$SCRATCH"

      - name: Extract (verify pins, derive committed evidence)
        if: inputs.mode == 'extract' || inputs.mode == 'both'
        run: |
          set -euo pipefail
          bun scripts/lexicon-etl.ts extract --lang "$LANG_INPUT" --dir "$SCRATCH"
          if [ "${AUTHOR_SIZE:-0}" != "0" ]; then
            bun scripts/lexicon-author.ts --lang "$LANG_INPUT" --size "$AUTHOR_SIZE"
          else
            bun scripts/lexicon-author.ts --lang "$LANG_INPUT" --size 0 --pool-only
          fi

      - name: Validate committed data offline (what CI will run)
        run: |
          set -euo pipefail
          bun run content:validate

      - name: Upload small raw artifacts for audit (never committed; dumps > 200 MB are identity-only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lexicon-raw-${{ inputs.lang }}-${{ inputs.mode }}
          path: |
            /tmp/lexicon-src/${{ inputs.lang }}/*.txt
            /tmp/lexicon-src/${{ inputs.lang }}/*.csv
            /tmp/lexicon-src/${{ inputs.lang }}/*.tar.gz
            /tmp/lexicon-src/${{ inputs.lang }}/kaikki-vi-*.jsonl
          retention-days: 90
          if-no-files-found: warn

      - name: Commit results to the dispatched branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "content/$LANG_INPUT"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          printf '%s\n' \
            "content($LANG_INPUT): lexicon ETL v2 $MODE_INPUT results (official sources, runner-side)" \
            "" \
            "Acquired from the official source locations on a GitHub-hosted runner by" \
            ".github/workflows/lexicon-source.yml; raw dumps streamed and discarded, small" \
            "artifacts retained as run artifacts only. This commit carries the pinned" \
            "manifest and the deterministic derived outputs." \
            "" \
            "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>" \
            > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
