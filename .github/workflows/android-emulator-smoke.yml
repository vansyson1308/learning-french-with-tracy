# Android emulator smoke on a GitHub-hosted runner (RC2 program Part VII):
# install an APK produced by another workflow run (the debug-signed QA build
# from android-release-build.yml or the EAS RC from eas-build.yml), cold
# launch, onboarding into the French course, deep links into the main
# screens, background/foreground, crash/ANR scan. Dispatch-only; no
# secrets. An emulator PASS never substitutes for the physical-phone
# acceptance (microphone, speech, TalkBack) in ANDROID_DEVICE_ACCEPTANCE_PACKETS.md.
name: Android emulator smoke

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id that produced the APK artifact"
        required: true
      artifact:
        description: "Artifact name holding the APK"
        required: false
        default: "android-release-qa"
      api_level:
        description: "Emulator API level"
        required: false
        default: "34"

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: apk
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Locate the APK
        run: |
          APK=$(find apk -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::no .apk in artifact ${{ inputs.artifact }}"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"; ls -la "$APK"; sha256sum "$APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run the smoke on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-smoke.sh "$APK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke
          path: emulator-smoke
          retention-days: 30
