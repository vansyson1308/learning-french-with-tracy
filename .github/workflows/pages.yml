# Public documentation site (V1 publication program, Part III).
#
# Builds dist-site/ from repository sources (scripts/build-site.ts: the
# in-app privacy policy module, docs/USER_GUIDE.md, ATTRIBUTIONS.md and
# site/content/*.md) and publishes it with GitHub Pages. No analytics, no
# cookies, no external assets. Runs on pushes to main that touch the
# sources, and on manual dispatch.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "scripts/build-site.ts"
      - "src/lib/privacy-policy.ts"
      - "ATTRIBUTIONS.md"
      - "release/support-contact.json"
      - "app.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build the site
        run: bun scripts/build-site.ts
      - name: Configure Pages (enables the site if the token may)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify the deployed pages over HTTPS (with propagation backoff)
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: scripts/verify-site.sh "$PAGE_URL"
