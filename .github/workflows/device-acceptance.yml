# P3h — automated device acceptance on Android emulators (API 34 and 30).
#
# Builds the x86_64 release APK of this commit and (cached) of RC3
# (e5dcfd0, the last device-tested build), then runs
# scripts/device/acceptance.sh on each emulator: fresh install, Vietnamese
# onboarding, one lesson in every shipped course with audio events, Today
# with daily words, a scored checkpoint, an exam mock part, Profile, the
# speech-recogniser-unavailable path, backup export → pm clear → import,
# offline, crash/ANR logcat scan, cold start (budget enforced on API 34),
# memory, vi + en screenshots, and the upgrade from RC3 with learner data
# compared field by field. Required for merge: every shard on both APIs.
# The lessons shard also plays an Opus mono 16 kbps story sentence through
# expo-audio at rate 1 and in slow mode (acceptance-only route, built in by
# LFT_ACCEPTANCE_DIAGNOSTICS=1; release/ASSET_DELIVERY.md).
#
# The suite runs in three shards per API level (core, lessons,
# backup-upgrade), each on its own emulator, so a job stays well under its
# limit and a failure points at one part. A hung `maestro test` is killed
# after FLOW_TIMEOUT (diagnostics in logs/<flow>.hang/), and the whole run
# is wrapped in a 75 min watchdog inside a 90 min job: a hang ends as a
# FAILED job with its report uploaded, never as a job cancelled hours later.
#
# Every result is an EMULATOR result. Maestro (Apache-2.0) is downloaded
# here, checksum-pinned, and never bundled with the app. No secrets: both
# APKs are signed with the Expo template's debug key, so `adb install -r`
# over RC3 is a real same-signer upgrade.
name: Device acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  # Maven Central read timeouts stalled the x86_64 build for 41 min (2026-10-28): bounded
  # HTTP (connect 60 s, read 120 s) with 5 retries; a stall now fails inside the step limit.
  GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
  RC3_COMMIT: e5dcfd015c407bf445afae9d517661f367934104
  MAESTRO_VERSION: 2.12.0
  MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
  # No network side-calls from the Maestro CLI; a slow driver start is
  # waited for (2 min) instead of failing at the 15 s default.
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"

jobs:
  build:
    name: Build x86_64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - run: bun install --frozen-lockfile
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}
          restore-keys: gradle-${{ runner.os }}-
      # LFT_ACCEPTANCE_DIAGNOSTICS=1: this APK (and only this one) also bundles the
      # Opus playback check, src/app/diagnostics/opus.tsx + its fixture (metro.config.js).
      # Every release build leaves the flag unset and proves the absence
      # (scripts/check-diagnostics-export.ts; release/ASSET_DELIVERY.md).
      - name: Generate the native project and build
        timeout-minutes: 30 # normal 11-13 min
        env:
          LFT_ACCEPTANCE_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          bunx expo prebuild --platform android --no-install --clean
          (cd android && ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=x86_64)
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk out/app-x86_64.apk
          ls -la out && sha256sum out/*.apk
      - name: The acceptance APK carries the Opus check (route + fixture)
        run: |
          set -euo pipefail
          rm -rf /tmp/apk-x && mkdir -p /tmp/apk-x && unzip -q out/app-x86_64.apk -d /tmp/apk-x
          bun scripts/check-diagnostics-export.ts /tmp/apk-x --present
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-x86_64
          path: out/app-x86_64.apk
          retention-days: 7

  build-rc3:
    name: Build RC3 x86_64 APK (cached)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: cache
        with:
          path: out/rc3-x86_64.apk
          key: rc3-apk-${{ env.RC3_COMMIT }}-x86_64-v1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          ref: ${{ env.RC3_COMMIT }}
          path: rc3
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build RC3
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 40
        working-directory: rc3
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx expo prebuild --platform android --no-install --clean
          (cd android && ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=x86_64)
          mkdir -p ../out && cp android/app/build/outputs/apk/release/app-release.apk ../out/rc3-x86_64.apk
      - run: ls -la out && sha256sum out/*.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-rc3-x86_64
          path: out/rc3-x86_64.apk
          retention-days: 7

  acceptance:
    name: Emulator API ${{ matrix.api }} (${{ matrix.shard }})
    needs: [build, build-rc3]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Also read by scripts/device/emulator-health.sh for its one infra retry.
      # -change-locale restarts the framework after boot; the health check waits
      # for that restart before the app is installed. -prop persist.sys.locale does not take.
      AVD_NAME: test
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -change-locale vi-VN
    strategy:
      fail-fast: false
      matrix:
        api: [34, 30]
        shard: [core, lessons, backup-upgrade]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-x86_64
          path: apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk-rc3-x86_64
          path: apk
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maestro (checksum-pinned)
        timeout-minutes: 10
        run: |
          set -euo pipefail
          bash scripts/ci/fetch.sh "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" /tmp/maestro.zip
          echo "${MAESTRO_SHA256}  /tmp/maestro.zip" | sha256sum -c -
          unzip -q /tmp/maestro.zip -d "$HOME/maestro-cli"
          echo "MAESTRO=$HOME/maestro-cli/maestro/bin/maestro" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the acceptance suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          RC3_APK: apk/rc3-x86_64.apk
          SHARD: ${{ matrix.shard }}
          DEVICE: emulator-5554
          FLOW_TIMEOUT: "600"
          ENFORCE_COLD_START: ${{ matrix.api == 34 && '1' || '0' }}
          # The APK was built with LFT_ACCEPTANCE_DIAGNOSTICS=1: the lessons shard runs the Opus check.
          OPUS_DIAGNOSTICS: "1"
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          avd-name: ${{ env.AVD_NAME }}
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          # Suite watchdog: 75 min, then SIGTERM (the script records the stop
          # and writes its report), SIGKILL 2 min later.
          script: timeout --kill-after=2m 75m bash scripts/device/acceptance.sh apk/app-x86_64.apk device-report
      - name: Report
        if: always()
        run: '[ -f device-report/REPORT.md ] && cat device-report/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-report-api${{ matrix.api }}-${{ matrix.shard }}
          path: device-report
          retention-days: 30
