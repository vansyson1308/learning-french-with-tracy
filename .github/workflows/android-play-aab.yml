# D-16 Google Play closed test: build the UNSIGNED release AAB (arm64-v8a +
# armeabi-v7a) with the same script the owner runs locally
# (plan/scripts/build-play-aab.sh) and keep it as an artifact. Dispatch-only:
# it never runs on push, uses no secrets, signs nothing and uploads to no
# store. The owner downloads the artifact, signs it with the upload key on
# their own PC (plan/scripts/sign-aab-windows.cmd, release/PLAY_SIGNING.md)
# and uploads it to the closed-testing track by hand.
name: Android Play AAB (unsigned)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (default: the branch the workflow runs on, normally main)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the unsigned AAB (identity gate, drift check, prebuild, bundleRelease, artifact checks)
        timeout-minutes: 60
        env:
          # Same bounded Maven HTTP settings as android-release-build.yml (2026-10-28 stall).
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000
        run: bash plan/scripts/build-play-aab.sh
      - name: Summary
        run: |
          {
            echo "## Unsigned Play AAB (sign it locally with the upload key before uploading)"
            echo '```'
            cat out/play/*.report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-aab-unsigned
          path: |
            out/play/*-unsigned.aab
            out/play/*.report.txt
          retention-days: 14
