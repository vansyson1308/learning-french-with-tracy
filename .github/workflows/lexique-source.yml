# Developer-dispatched Lexique 4 source acquisition (Phase 5A).
#
# This is NOT part of the CI gate and can never run automatically: it has
# exactly one trigger, workflow_dispatch. The validation workflow (ci.yml)
# stays fully offline on committed derived data. This workflow exists
# because the interactive build environment sits behind an egress
# allowlist that does not include lexique.org, while GitHub-hosted runners
# reach the OFFICIAL source directly — no mirrors, ever.
#
# Modes:
#   recon    Download the official artifact TWICE (reproducibility check:
#            both downloads must hash identically), record byte size and
#            SHA-256, fetch the official README, and commit a column
#            profile + samples so the real Lexique 4 layout can be mapped
#            deliberately. No extraction happens in this mode.
#   extract  Re-download, verify against the SHA-256 already pinned in
#            content/fr/lexicon/source-manifest.json (fail-closed: any
#            mismatch aborts as source-version drift), then run the
#            deterministic derivation and commit the derived subset,
#            candidate pool, and reports.
#
# The raw ~33 MB TSV is uploaded as a run artifact for audit and is never
# committed to the repository.
name: Lexique 4 source

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon (first contact) or extract (requires pinned manifest)"
        required: true
        type: choice
        options: [recon, extract]

permissions:
  contents: write

concurrency:
  group: lexique-source
  cancel-in-progress: false

jobs:
  acquire:
    # Defense in depth: refuse anything but a manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TSV_URL: "https://www.lexique.org/databases/Lexique400/Lexique400.tsv"
      ZIP_URL: "https://www.lexique.org/databases/Lexique400/Lexique400.zip"
      README_URL: "https://www.lexique.org/databases/Lexique400/README-Lexique.txt"
      ARTIFACT: /tmp/Lexique400.tsv
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11 # same pin as ci.yml
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Download official artifact (with official-ZIP fallback)
        run: |
          set -euo pipefail
          fetch_tsv () {
            local out="$1"
            if curl -fSL --retry 3 --retry-delay 5 -o "$out" "$TSV_URL"; then
              return 0
            fi
            echo "Direct TSV failed; trying official ZIP"
            curl -fSL --retry 3 --retry-delay 5 -o /tmp/Lexique400.zip "$ZIP_URL"
            sha256sum /tmp/Lexique400.zip | tee /tmp/zip.sha
            unzip -o /tmp/Lexique400.zip -d /tmp/lexique-zip
            find /tmp/lexique-zip -name '*.tsv' -o -name '*.txt' | head -20
            TSV_IN_ZIP=$(find /tmp/lexique-zip -iname 'Lexique400.tsv' | head -1)
            test -n "$TSV_IN_ZIP"
            cp "$TSV_IN_ZIP" "$out"
          }
          fetch_tsv "$ARTIFACT"
          # Reproducibility: a second retrieval must produce the same bytes.
          fetch_tsv /tmp/Lexique400-second.tsv
          H1=$(sha256sum "$ARTIFACT" | cut -d' ' -f1)
          H2=$(sha256sum /tmp/Lexique400-second.tsv | cut -d' ' -f1)
          echo "first : $H1"
          echo "second: $H2"
          if [ "$H1" != "$H2" ]; then
            echo "::error::The two retrievals differ — refusing to pin an unstable artifact."
            exit 1
          fi
          ls -la "$ARTIFACT"
          curl -fSL --retry 3 --retry-delay 5 -o /tmp/README-Lexique.txt "$README_URL" || echo "README fetch failed (non-fatal)"

      - name: Recon (header, column profile, samples, official README)
        if: inputs.mode == 'recon'
        run: |
          set -euo pipefail
          mkdir -p content/fr/lexicon/derived
          bun scripts/lexique-recon.ts --artifact "$ARTIFACT" --url "$TSV_URL"
          if [ -s /tmp/README-Lexique.txt ]; then
            cp /tmp/README-Lexique.txt content/fr/lexicon/derived/README-Lexique400.txt
          fi

      - name: Extract (verify pinned hash, derive committed subsets)
        if: inputs.mode == 'extract'
        run: |
          set -euo pipefail
          bun run lexicon:source:verify -- --artifact "$ARTIFACT"
          bun scripts/lexique-derive.ts --artifact "$ARTIFACT"

      - name: Upload raw artifact for audit (never committed)
        uses: actions/upload-artifact@v4
        with:
          name: lexique400-raw-${{ inputs.mode }}
          path: |
            /tmp/Lexique400.tsv
            /tmp/README-Lexique.txt
          retention-days: 90
          if-no-files-found: error

      - name: Commit results to the dispatched branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/fr/lexicon
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          printf '%s\n' \
            "Phase 5A: Lexique 4 ${{ inputs.mode }} results (official source, runner-side)" \
            "" \
            "Acquired from the official lexique.org distribution on a GitHub-hosted" \
            "runner (the interactive build environment's egress allowlist does not" \
            "include lexique.org). Raw artifact retained as a workflow run artifact" \
            "only; this commit carries the derived, deterministic outputs." \
            "" \
            "Co-Authored-By: Claude <noreply@anthropic.com>" \
            "Claude-Session: https://claude.ai/code/session_01AwHYc63cWfazzNrf1PyqCf" \
            > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "HEAD:${{ github.ref_name }}"
