# Developer-dispatched audio pipeline v2 (P3b) — replaces pack-audio.yml and
# reception-audio.yml.
#
# NOT part of the CI gate and can never run automatically: exactly one
# trigger, workflow_dispatch. Model weights and ASR models are downloaded
# to the runner, verified, USED and discarded — never committed. Every
# engine (Piper, Kokoro-82M, MeloTTS) and every voice is pinned in
# content/audio/engines.json + the manifests; the licence gate fails closed.
#
# Modes:
#   recon     Download every candidate voice of the language TWICE (identical
#             hashes), read its licence card, apply the gate, pin, commit cards.
#   canary    recon + synthesise the language's canary (content/<lang>/reception/
#             audio-canary.json × every eligible candidate, plus 12 pack strings
#             per course), ASR-audit (Whisper, or SenseVoice for zh/ja/ko),
#             QA, select the voice cast (content/audio/voice-casts.json) and
#             register the chosen voices; commit reports + pins.
#   generate  Verify pins, synthesise the chosen layers (pack / lexicon /
#             reception / all) with the selected cast, technical QA on every
#             clip (fail fast, before ASR), ASR audit of the clips not in the
#             ASR cache, strict QA, apply (per-language merge of
#             src/content/audio-manifest.ts and the assets), re-bless THIS
#             language's baseline, recompile, validate, check-audio, commit.
#
# QC 2026-10-29b §3: five German runs failed after 1–2.5 h of ASR because a
# duration check ran last. Now: Synthesize → Technical QA (minutes; any
# failure stops the run) → ASR audit with an incremental cache keyed by
# sha256(clip bytes + model id + transcript) (actions/cache, per language +
# recogniser; a one-clip fix re-audits one clip) → strict QA.
name: Audio pipeline (v2)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon | canary | generate"
        required: true
        type: choice
        options: [recon, canary, generate]
      lang:
        description: "target language code (es, de, it, pt, ja, ko, zh, en, vi; fr only for reception re-runs)"
        required: true
        type: string
      layer:
        description: "pack | reception | lexicon | all"
        required: false
        default: "all"
        type: choice
        options: [pack, reception, lexicon, all]
      courses:
        description: "comma-separated course ids of the language (default: all of them)"
        required: false
        default: ""
        type: string
      pending:
        description: "other languages whose audio run comes next (e.g. de): only THEIR missing-audio errors are deferred; never the run's own language"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  # actions: write — scripts/ci/bot-commit.sh dispatches ci.yml and device-acceptance.yml
  # on the branch it pushed to (a bot-authored head gets no checks otherwise).
  actions: write

# One audio run at a time across languages: every run edits the shared voice-casts /
# pack manifest / registry / ATTRIBUTIONS files, and concurrent pushes conflicted on rebase.
concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Hosted-runner maximum: es generate (2,590 clips) synthesises in ~80 min and audits with
    # Whisper medium; 240 min was not enough (run 38650406518).
    timeout-minutes: 360
    env:
      # QC 2026-10-29b §2.5 (scripts/lib/audio-pending.ts): read by validation and the bot-commit gate.
      LFT_AUDIO_PENDING: ${{ inputs.pending }}
      DL: /tmp/audio-voices
      WAV: /tmp/audio-wav
      OUT: /tmp/audio-mp3
      SFX: /tmp/audio-sfx
      PLAN: /tmp/audio-plan.json
      ASR: /tmp/audio-asr.json
      ASR_CACHE: /tmp/audio-asr-cache
      TECH_QA: /tmp/audio-tech-qa.json
      # Inputs reach the shell only through the environment (never expanded into the script text).
      MODE_INPUT: ${{ inputs.mode }}
      LANG_INPUT: ${{ inputs.lang }}
      LAYER_INPUT: ${{ inputs.layer }}
      COURSES_INPUT: ${{ inputs.courses }}
      BRANCH: ${{ github.ref_name }}
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11 # same pin as ci.yml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Validate inputs and plan offline (dry run)
        run: |
          set -euo pipefail
          case "$LANG_INPUT" in [a-z][a-z]|[a-z][a-z][a-z]) ;; *) echo "lang must be a 2-3 letter code"; exit 1;; esac
          # pending never names the run's own language (its missing audio must always fail).
          bun scripts/lib/audio-pending.ts
          ARGS=(--lang "$LANG_INPUT" --layer "$LAYER_INPUT")
          [ -n "$COURSES_INPUT" ] && ARGS+=(--courses "$COURSES_INPUT")
          if [ "$MODE_INPUT" = "generate" ]; then
            bun scripts/audio.ts plan "${ARGS[@]}" --mode generate --dry-run
          else
            bun scripts/audio.ts plan "${ARGS[@]}" --mode canary --dry-run || echo "canary dry run reported problems (expected before recon pins exist)"
          fi

      - name: Download pinned / candidate voices (recon and canary download twice)
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$DL"
          DLMODE=$([ "$MODE_INPUT" = "generate" ] && echo generate || echo recon)
          ARGS=(--lang "$LANG_INPUT" --layer "$LAYER_INPUT" --mode "$DLMODE")
          [ -n "$COURSES_INPUT" ] && ARGS+=(--courses "$COURSES_INPUT")
          # One download per distinct URL per copy (Kokoro voices share the 327 MB model), then copied to each voice's local name.
          bun scripts/audio.ts download-list "${ARGS[@]}" | while IFS=$'\t' read -r voice kind url copies; do
            [ -z "$voice" ] && continue
            for copy in $(seq 1 "$copies"); do
              cache="$DL/.cache/$(printf '%s' "$url" | sha256sum | cut -c1-32).$copy"
              if [ ! -f "$cache" ]; then
                mkdir -p "$DL/.cache"
                echo "downloading $url (copy $copy)"
                bash scripts/ci/fetch.sh "$url" "$cache"
              fi
              cp "$cache" "$DL/$voice.$kind.$copy"
            done
          done
          ls -la "$DL" | head -60

      - name: Recon — pin hashes + licence gate (fail closed)
        if: inputs.mode != 'generate'
        run: |
          set -euo pipefail
          ARGS=(--lang "$LANG_INPUT" --layer "$LAYER_INPUT" --downloads "$DL")
          [ -n "$COURSES_INPUT" ] && ARGS+=(--courses "$COURSES_INPUT")
          bun scripts/audio.ts recon "${ARGS[@]}"

      - name: Verify pins (fail closed on upstream drift)
        if: inputs.mode == 'generate'
        run: |
          set -euo pipefail
          ARGS=(--lang "$LANG_INPUT" --layer "$LAYER_INPUT" --downloads "$DL")
          [ -n "$COURSES_INPUT" ] && ARGS+=(--courses "$COURSES_INPUT")
          bun scripts/audio.ts verify "${ARGS[@]}"

      - name: Install the engines the plan needs (pinned) + ffmpeg
        timeout-minutes: 20 # normal 3 min
        if: inputs.mode != 'recon'
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          DLMODE=$([ "$MODE_INPUT" = "generate" ] && echo generate || echo recon)
          ARGS=(--lang "$LANG_INPUT" --layer "$LAYER_INPUT" --mode "$DLMODE")
          [ -n "$COURSES_INPUT" ] && ARGS+=(--courses "$COURSES_INPUT")
          NEEDED=$(bun scripts/audio.ts engines-needed "${ARGS[@]}")
          echo "engines needed: $NEEDED"
          for engine in $NEEDED; do
            bun -e "const e=require('./content/audio/engines.json').engines['$engine']; for (const line of e.install) console.log(line)" | while read -r line; do
              case "$line" in
                apt-get*) sudo $line ;;
                *) eval "$line" ;;
              esac
            done
          done
          piper --version 2>/dev/null || true

      - name: Synthesize
        timeout-minutes: 90 # longest observed 30 min
        if: inputs.mode != 'recon'
        run: |
          set -euo pipefail
          PLANMODE=$([ "$MODE_INPUT" = "generate" ] && echo generate || echo canary)
          ARGS=(--lang "$LANG_INPUT" --layer "$LAYER_INPUT" --mode "$PLANMODE" --out "$PLAN")
          [ -n "$COURSES_INPUT" ] && ARGS+=(--courses "$COURSES_INPUT")
          bun scripts/audio.ts plan "${ARGS[@]}"
          # generate reuses every already-blessed content-addressed asset of the language
          # (pack + lexicon folder, and the reception folder: clips and P5b story sentences
          # keep their bytes, only new keys are synthesized)
          EXISTING_DIRS=""
          if [ "$MODE_INPUT" = "generate" ]; then
            for d in "assets/audio/$LANG_INPUT" "assets/audio/$LANG_INPUT-reception"; do
              [ -d "$d" ] && EXISTING_DIRS="${EXISTING_DIRS:+$EXISTING_DIRS,}$d"
            done
          fi
          EXISTING=$([ -n "$EXISTING_DIRS" ] && echo "--existing $EXISTING_DIRS" || echo "")
          bun scripts/audio.ts synth-script --lang "$LANG_INPUT" --plan "$PLAN" --dl "$DL" --wav "$WAV" --out "$OUT" $EXISTING > /tmp/synth.sh
          bash /tmp/synth.sh
          ls "$OUT" | wc -l

      # QC 2026-10-29b §3.1: every cheap technical check (duration and speech-only floors,
      # speaking rate, clipping, near-silence, edge silence, file size) on every clip,
      # BEFORE the ASR audit — a bad clip stops the run in minutes, not after hours of ASR.
      # The strict QA of the generate step repeats the same checks; nothing is relaxed.
      - name: Technical QA — fail fast, before ASR
        timeout-minutes: 20 # ~1,400 clips in a few minutes
        if: inputs.mode == 'generate'
        run: |
          set -euo pipefail
          bun scripts/audio.ts tech-qa --lang "$LANG_INPUT" --plan "$PLAN" --outdir "$OUT" --report "$TECH_QA"

      - name: Choose the ASR recogniser (cache key per language + recogniser)
        if: inputs.mode != 'recon'
        run: |
          set -euo pipefail
          # Whisper medium for generate runs, and for Vietnamese canaries too (P3e: base
          # returned empty or digit-only transcripts for the vi canary); SenseVoice for zh/ja/ko.
          ASR_MODEL=$( { [ "$MODE_INPUT" = "generate" ] || [ "$LANG_INPUT" = "vi" ]; } && echo medium || echo base)
          case "$LANG_INPUT" in
            zh|ja|ko)
              FUNASR=$(bun -e "console.log(require('./content/audio/engines.json').asr.sensevoice.pinnedVersion)")
              SV_MODEL=$(bun -e "console.log(require('./content/audio/engines.json').asr.sensevoice.model)")
              RECOGNIZER="sensevoice:funasr==$FUNASR:$SV_MODEL"
              RECOGNIZER_KEY="sensevoice-$FUNASR"
              ;;
            *)
              WHISPER=$(bun -e "console.log(require('./content/audio/engines.json').asr.whisper.pinnedVersion)")
              RECOGNIZER="faster-whisper==$WHISPER:$ASR_MODEL"
              RECOGNIZER_KEY="whisper-$WHISPER-$ASR_MODEL"
              ;;
          esac
          {
            echo "ASR_MODEL=$ASR_MODEL"
            echo "ASR_RECOGNIZER=$RECOGNIZER"
            echo "ASR_RECOGNIZER_KEY=$RECOGNIZER_KEY"
          } >> "$GITHUB_ENV"
          echo "recogniser: $RECOGNIZER"

      # QC 2026-10-29b §3.2: ASR results cached by sha256(clip bytes + model id + transcript);
      # the newest cache of this language + recogniser is restored (restore-keys: partial hit).
      - name: Restore the ASR cache
        if: inputs.mode != 'recon'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/audio-asr-cache
          key: audio-asr-v1-${{ inputs.lang }}-${{ env.ASR_RECOGNIZER_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            audio-asr-v1-${{ inputs.lang }}-${{ env.ASR_RECOGNIZER_KEY }}-

      - name: ASR audit of the uncached clips (Whisper, or SenseVoice for zh/ja/ko — technical signal only)
        id: asr
        timeout-minutes: 300 # longest observed 151 min (no cache); a cached re-run audits only changed clips
        if: inputs.mode != 'recon'
        run: |
          set -euo pipefail
          mkdir -p "$ASR_CACHE"
          CACHE_ARGS=(--lang "$LANG_INPUT" --plan "$PLAN" --outdir "$OUT" --cache "$ASR_CACHE" --recognizer "$ASR_RECOGNIZER")
          bun scripts/audio.ts asr-cache split "${CACHE_ARGS[@]}" --todo /tmp/asr-todo-plan.json --hits /tmp/asr-hits.json
          TODO=$(bun -e "console.log(require('/tmp/asr-todo-plan.json').clips.length)")
          if [ "$TODO" -gt 0 ]; then
            case "$LANG_INPUT" in
              zh|ja|ko)
                FUNASR=$(bun -e "console.log(require('./content/audio/engines.json').asr.sensevoice.pinnedVersion)")
                pip install "funasr==$FUNASR" torch torchaudio huggingface_hub
                ;;
            esac
            WHISPER=$(bun -e "console.log(require('./content/audio/engines.json').asr.whisper.pinnedVersion)")
            pip install "faster-whisper==$WHISPER" requests
            python3 scripts/audio-asr-audit.py --plan /tmp/asr-todo-plan.json --outdir "$OUT" --out /tmp/asr-fresh.json --engine auto --model "$ASR_MODEL"
          else
            echo "every clip is in the ASR cache — no transcription needed"
            echo '{}' > /tmp/asr-fresh.json
          fi
          bun scripts/audio.ts asr-cache merge "${CACHE_ARGS[@]}" --hits /tmp/asr-hits.json --fresh /tmp/asr-fresh.json --out "$ASR"

      # Saved right after a successful audit, so a later strict-QA failure keeps the ASR work.
      - name: Save the ASR cache
        if: inputs.mode != 'recon' && steps.asr.outcome == 'success'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/audio-asr-cache
          key: audio-asr-v1-${{ inputs.lang }}-${{ env.ASR_RECOGNIZER_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Canary QA + voice-cast selection
        if: inputs.mode == 'canary'
        run: |
          set -euo pipefail
          REPORTS=$([ "$LANG_INPUT" = "fr" ] && echo content/reports || echo "content/reports/$LANG_INPUT")
          mkdir -p "$REPORTS"
          bun scripts/audio.ts qa --lang "$LANG_INPUT" --plan "$PLAN" --outdir "$OUT" --report "$REPORTS/audio-canary.json" --asr "$ASR"
          ARGS=(--lang "$LANG_INPUT" --layer "$LAYER_INPUT" --report "$REPORTS/audio-canary.json")
          [ -n "$COURSES_INPUT" ] && ARGS+=(--courses "$COURSES_INPUT")
          bun scripts/audio.ts select "${ARGS[@]}"
          bun scripts/compile-content.ts
          bun scripts/validate-content.ts

      - name: Generate — strict QA, apply (per-language merge), baseline, compile, validate
        timeout-minutes: 30 # longest observed 8 min
        if: inputs.mode == 'generate'
        run: |
          set -euo pipefail
          REPORTS=$([ "$LANG_INPUT" = "fr" ] && echo content/reports || echo "content/reports/$LANG_INPUT")
          mkdir -p "$REPORTS"
          SFXARG=""
          if [ ! -f assets/sfx/correct.wav ]; then
            bun scripts/audio.ts sfx-script --out "$SFX" > /tmp/sfx.sh && bash /tmp/sfx.sh && SFXARG="--sfx $SFX"
          fi
          bun scripts/audio.ts qa --lang "$LANG_INPUT" --plan "$PLAN" --outdir "$OUT" --report "$REPORTS/audio-quality.json" --asr "$ASR" --strict true
          bun scripts/audio.ts apply --lang "$LANG_INPUT" --plan "$PLAN" --outdir "$OUT" $SFXARG
          bun scripts/compile-content.ts
          bun scripts/validate-content.ts
          bun scripts/check-audio.ts

      - name: Upload run artifact (audio for audit)
        # always(): a failed QA must leave its report and clips for diagnosis (run 40758568130 left nothing).
        if: always() && inputs.mode != 'recon'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audio-${{ inputs.lang }}-${{ inputs.mode }}-${{ inputs.layer }}
          path: |
            /tmp/audio-mp3
            /tmp/audio-asr.json
            /tmp/audio-plan.json
            /tmp/audio-tech-qa.json
            content/reports/${{ inputs.lang }}/audio-quality.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit results to the dispatched branch
        timeout-minutes: 30 # full gate, normal 2 min
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "audio workflow"
          git config user.email "actions@users.noreply.github.com"
          # Gated commit (scripts/ci/bot-commit.sh): goldens re-blessed with this run's
          # reason, then bun run test + content:check + audio:check — a failure commits nothing.
          {
            echo "audio($LANG_INPUT): $MODE_INPUT ($LAYER_INPUT) — pinned-source pipeline output"
            echo
            echo "Dispatch-only workflow run $GITHUB_RUN_ID (mode: $MODE_INPUT, lang: $LANG_INPUT, layer: $LAYER_INPUT)."
            echo "Engines pinned in content/audio/engines.json, voices in the manifests; model weights"
            echo "were used on the runner and never committed."
            echo
            echo "Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>"
          } > /tmp/commit-msg.txt
          bash scripts/ci/bot-commit.sh --branch "$BRANCH" --message /tmp/commit-msg.txt \
            --reason "audio.yml $LANG_INPUT $MODE_INPUT ($LAYER_INPUT) run $GITHUB_RUN_ID" -- \
            content/audio content/reports content/sources/registry.json "content/$LANG_INPUT/reception" \
            "assets/audio/$LANG_INPUT" "assets/audio/$LANG_INPUT-reception" assets/sfx assets/lexicon src/content content/courses ATTRIBUTIONS.md
