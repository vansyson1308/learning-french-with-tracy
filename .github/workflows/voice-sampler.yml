# Voice samplers (QC 2026-11-03 §1.2): one MP3 per language (fr, de, pt, en) built from the
# bundled clips — 10 words, 6 sentences, 2 dialogues, normal speed then 0.75× — so the owner can
# hear every voice in five minutes without a phone (plan/OWNER-FINAL-CHECKLIST.md, top item).
# Reads only committed files; writes nothing back; the artifact is the only output.
name: Voice sampler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/audio/**"
      - "scripts/voice-sampler.ts"
      - ".github/workflows/voice-sampler.yml"

permissions:
  contents: read

concurrency:
  group: voice-sampler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samplers:
    name: Voice samplers (fr, de, pt, en)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11 # same pin as ci.yml
      - name: Install ffmpeg
        timeout-minutes: 10
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Render the samplers
        timeout-minutes: 10
        run: bun scripts/voice-sampler.ts --out voice-samplers fr de pt en
      - name: Upload the samplers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-samplers
          path: voice-samplers/
          retention-days: 90
