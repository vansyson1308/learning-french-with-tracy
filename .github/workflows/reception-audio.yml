# Developer-dispatched Phase-7 reception-audio pipeline (P7 §25-42).
#
# NOT part of the CI gate and can never run automatically: exactly one
# trigger, workflow_dispatch (same posture as lexique-source.yml). It exists
# because the interactive build environment cannot reach huggingface.co,
# while GitHub-hosted runners can. Model weights are downloaded to the
# runner, verified, USED, and discarded — never committed (P7 §35).
#
# Modes:
#   recon     Download each pinned voice's model/config/MODEL_CARD TWICE
#             (both copies must hash identically), parse dataset/license
#             from the MODEL_CARD, apply the license gate FAIL-CLOSED,
#             write hash pins + model cards + a recon report, commit.
#   canary    Verify pins, synthesize the committed canary set across the
#             speaker sweep, convert to MP3, run technical QA + the
#             faster-whisper ASR audit, commit the canary report ONLY
#             (canary audio ships as a run artifact, never to the repo).
#   generate  Verify pins, synthesize every clip in
#             content/fr/reception/listening.json, run the same QA + ASR
#             audit, and commit assets + the quality report.
name: Reception audio

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "recon | canary | generate"
        required: true
        type: choice
        options: [recon, canary, generate]

permissions:
  contents: write

concurrency:
  group: reception-audio
  cancel-in-progress: false

jobs:
  audio:
    # Defense in depth: refuse anything but a manual dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HF_BASE: https://huggingface.co/rhasspy/piper-voices/resolve
      DL: /tmp/voice-downloads
      WAV: /tmp/reception-wav
      OUT: /tmp/reception-mp3
      PLAN: /tmp/reception-plan.json
      ASR: /tmp/reception-asr.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11 # same pin as ci.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Download pinned voices
        run: |
          set -euo pipefail
          mkdir -p "$DL"
          REV=$(bun -e 'const m=require("./content/fr/reception/audio-source-manifest.json");console.log(m.voicesRevision)')
          bun -e '
            const m = require("./content/fr/reception/audio-source-manifest.json");
            for (const v of m.voices) for (const [kind, f] of Object.entries(v.files)) {
              console.log(`${v.id}\t${kind}\t${f.path}`);
            }
          ' | while IFS=$'\t' read -r voice kind relpath; do
            for copy in 1 2; do
              if [ "${{ inputs.mode }}" != "recon" ] && [ "$copy" = "2" ]; then
                continue # non-recon runs verify a single download against pins
              fi
              echo "downloading $voice.$kind (copy $copy)"
              curl -fSL --retry 3 --retry-delay 10 \
                -o "$DL/$voice.$kind.$copy" \
                "$HF_BASE/$REV/$relpath?download=true"
            done
          done
          ls -la "$DL"

      - name: Recon — pin hashes + license gate
        if: inputs.mode == 'recon'
        run: bun scripts/reception-audio.ts recon --downloads "$DL"

      - name: Verify pins (fail closed on upstream drift)
        if: inputs.mode != 'recon'
        run: bun scripts/reception-audio.ts verify --downloads "$DL"

      - name: Install piper-tts (pinned) + ffmpeg
        if: inputs.mode != 'recon'
        run: |
          set -euo pipefail
          PIPER_VERSION=$(bun -e 'const m=require("./content/fr/reception/audio-source-manifest.json");console.log(m.piperTts.pinnedVersion)')
          pip install "piper-tts==$PIPER_VERSION"
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          piper --version || true

      - name: Synthesize clips
        if: inputs.mode != 'recon'
        run: |
          set -euo pipefail
          bun scripts/reception-audio.ts plan --mode "$([ "${{ inputs.mode }}" = "canary" ] && echo canary || echo generate)" --out "$PLAN"
          bun scripts/reception-audio.ts synth-script --plan "$PLAN" --dl "$DL" --wav "$WAV" --out "$OUT" > /tmp/synth.sh
          bash /tmp/synth.sh
          ls "$OUT" | wc -l

      - name: ASR audit (faster-whisper, technical signal only)
        if: inputs.mode != 'recon'
        run: |
          set -euo pipefail
          pip install "faster-whisper==1.0.3" requests  # requests: undeclared fw dep with huggingface-hub>=1
          python3 scripts/reception-asr-audit.py --plan "$PLAN" --outdir "$OUT" --out "$ASR" --model base

      - name: Technical QA + report
        if: inputs.mode == 'canary'
        run: |
          set -euo pipefail
          bun scripts/reception-audio.ts qa --plan "$PLAN" --outdir "$OUT" \
            --report content/reports/reception-audio-canary.json --asr "$ASR"

      - name: Technical QA + commit generated assets
        if: inputs.mode == 'generate'
        run: |
          set -euo pipefail
          mkdir -p assets/audio/fr-reception
          cp "$OUT"/*.mp3 assets/audio/fr-reception/
          bun scripts/reception-audio.ts qa --plan "$PLAN" --outdir assets/audio/fr-reception \
            --report content/reports/reception-audio-quality.json --asr "$ASR" --strict true
          cp "$PLAN" content/fr/reception/generated-plan.json

      - name: Upload run artifact (audio for audit)
        if: inputs.mode != 'recon'
        uses: actions/upload-artifact@v4
        with:
          name: reception-audio-${{ inputs.mode }}
          path: |
            /tmp/reception-mp3
            /tmp/reception-asr.json
          retention-days: 90
          if-no-files-found: error

      - name: Commit results to the dispatched branch
        run: |
          set -euo pipefail
          git config user.name "reception-audio workflow"
          git config user.email "actions@users.noreply.github.com"
          # Paths added individually: a multi-path `git add` is all-or-nothing
          # and a missing assets dir silently staged NOTHING on the first
          # successful recon run.
          for p in content/fr/reception content/reports assets/audio/fr-reception; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          {
            echo "Reception audio ${{ inputs.mode }}: pinned-source pipeline output"
            echo
            echo "Dispatch-only workflow run ${{ github.run_id }} (mode: ${{ inputs.mode }})."
            echo "Sources pinned in content/fr/reception/audio-source-manifest.json;"
            echo "model weights were used on the runner and never committed."
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push origin "HEAD:${{ github.ref_name }}"
